name: 🐞 Bug report
description: Report a defect in the library or the VS Code extension.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real key material or production tokens.** Use a freshly generated throwaway key in any repro.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet. Throwaway keys/tokens only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "PostQuantum.Jwt 1.0.0-preview.5 · VS Code extension 0.1.3"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: ".NET 10 · Linux · OpenSSL 3.5 — or — VS Code 1.x"
    validations:
      required: true
