name: Build demo images (ProductionDeploymentDemo)

# Builds and pushes the two ProductionDeploymentDemo container images to
# ghcr.io as public OCI images. Tags:
#   :latest   — always the head of main
#   :<sha>    — the short commit SHA (immutable)
#   :v<tag>   — when a `v*` release tag is pushed
#
# Public images so the Container Apps deployment can pull without
# authentication. The Container Apps Bicep defaults reference
# ghcr.io/systemslibrarian/pqjwt-demo-{issuer,orders}:latest.

on:
  push:
    branches: [main]
    paths:
      - 'samples/ProductionDeploymentDemo/**'
      - 'src/PostQuantum.Jwt/**'
      - 'src/PostQuantum.Jwt.AspNetCore/**'
      - '.github/workflows/build-demo-images.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # required to push to ghcr.io
  attestations: write   # for build-provenance attestation on each image
  id-token: write       # for OIDC-backed attestation signing

env:
  REGISTRY: ghcr.io
  ISSUER_IMAGE: ${{ github.repository_owner }}/pqjwt-demo-issuer
  ORDERS_IMAGE: ${{ github.repository_owner }}/pqjwt-demo-orders

jobs:
  build-issuer:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata (issuer)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ISSUER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Build & push (issuer)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: samples/ProductionDeploymentDemo/IssuerApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=issuer
          cache-to: type=gha,scope=issuer,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance (issuer)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ISSUER_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-orders:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata (orders)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORDERS_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Build & push (orders)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: samples/ProductionDeploymentDemo/OrdersApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orders
          cache-to: type=gha,scope=orders,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance (orders)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ORDERS_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
