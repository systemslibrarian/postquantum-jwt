name: Release

# Publishes the NuGet package when a version tag (e.g. v0.2.0-preview.1) is pushed.
# Requires the NUGET_API_KEY secret on the 'nuget-publish' environment to push to nuget.org.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write       # for GitHub OIDC-backed build provenance attestations
  attestations: write   # for the attest-build-provenance action

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for deterministic SourceLink

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check version is in sync across csproj/README/CHANGELOG
        run: bash scripts/check-version-sync.sh

      - name: Resolve and verify package version against tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          csproj_version=$(grep -oP '(?<=<Version>)[^<]+' src/PostQuantum.Jwt/PostQuantum.Jwt.csproj)
          if [ "$tag" != "$csproj_version" ]; then
            echo "::error::Tag version ($tag) does not match csproj <Version> ($csproj_version)."
            exit 1
          fi
          echo "package_version=$csproj_version" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Test (Release)
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/PostQuantum.Jwt/PostQuantum.Jwt.csproj -c Release --no-build -o artifacts

      - name: Compute SHA-256 of artifacts for transparency
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum *.nupkg *.snupkg | tee SHA256SUMS.txt)
          echo "---- SHA256SUMS.txt ----"
          cat artifacts/SHA256SUMS.txt
          echo "------------------------"

      - name: Generate build-provenance attestation for the .nupkg
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "artifacts/*.nupkg"

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: |
            artifacts/*.*nupkg
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: pack
    # Bind to a GitHub Environment so an approver can gate the actual push to
    # nuget.org. Configure the 'nuget-publish' environment in repo settings and
    # add NUGET_API_KEY there (not as a plain repo secret) to enforce review.
    environment: nuget-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: artifacts

      - name: Verify an API key is configured
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::NUGET_API_KEY is not set on the 'nuget-publish' environment."
            exit 1
          fi

      # NOTE: packages are NOT cryptographically author-signed yet (no code-signing
      # certificate). NuGet.org applies repository signing on push. Author signing
      # is tracked in KNOWN-GAPS.md. Build-provenance attestations (above) provide
      # an interim transparency signal — anyone can verify with `gh attestation
      # verify <nupkg> --repo systemslibrarian/postquantum-jwt`.
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
