name: Release

# Publishes the NuGet packages when a version tag (e.g. v1.0.0) is pushed.
#
# Authentication is NuGet Trusted Publishing (OIDC): the publish job exchanges
# the GitHub Actions OIDC token for a short-lived nuget.org API key via the
# NuGet/login action — there is NO long-lived NUGET_API_KEY secret. A matching
# Trusted Publishing policy must exist on nuget.org (account → Trusted Publishing)
# bound to:
#   repository owner = systemslibrarian
#   repository       = postquantum-jwt
#   workflow file    = release.yml
#   environment      = nuget-publish   (optional, recommended)
# The nuget.org account username that owns the policy is supplied via the
# `NUGET_USER` repository variable (Settings → Secrets and variables → Actions →
# Variables). It is not a secret.
#
# Optional NUGET_SIGNING_CERT (+ NUGET_SIGNING_CERT_PASSWORD) on the same
# environment enables author code signing of the .nupkg before push.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write       # for GitHub OIDC-backed build provenance attestations
  attestations: write   # for the attest-build-provenance action

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for deterministic SourceLink

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check version is in sync across csproj/README/CHANGELOG
        run: bash scripts/check-version-sync.sh

      - name: Resolve and verify package version against tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          csproj_version=$(grep -oP '(?<=<Version>)[^<]+' src/PostQuantum.Jwt/PostQuantum.Jwt.csproj)
          if [ "$tag" != "$csproj_version" ]; then
            echo "::error::Tag version ($tag) does not match csproj <Version> ($csproj_version)."
            exit 1
          fi
          echo "package_version=$csproj_version" >> "$GITHUB_OUTPUT"

      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Test (Release)
        run: dotnet test -c Release --no-build

      - name: Pack — main library
        run: dotnet pack src/PostQuantum.Jwt/PostQuantum.Jwt.csproj -c Release --no-build -o artifacts

      - name: Pack — AspNetCore companion
        run: dotnet pack src/PostQuantum.Jwt.AspNetCore/PostQuantum.Jwt.AspNetCore.csproj -c Release --no-build -o artifacts

      # The template package compiles nothing of its own (it bundles content), so
      # it is not part of the solution `dotnet build` above — pack it directly.
      - name: Pack — dotnet new templates
        run: dotnet pack templates/PostQuantum.Jwt.Templates.csproj -c Release -o artifacts

      - name: Pack — Roslyn analyzers
        run: dotnet pack src/Analyzers/PostQuantum.Jwt.Analyzers/PostQuantum.Jwt.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Generate top-level CycloneDX SBOM (in addition to the per-nupkg one)
        run: |
          set -euo pipefail
          dotnet CycloneDX src/PostQuantum.Jwt/PostQuantum.Jwt.csproj \
              --output artifacts \
              --filename bom.json \
              --json
          echo "---- SBOM head ----"
          head -c 1024 artifacts/bom.json
          echo
          echo "-------------------"

      - name: Compute SHA-256 of artifacts for transparency
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum *.nupkg *.snupkg bom.json | tee SHA256SUMS.txt)
          echo "---- SHA256SUMS.txt ----"
          cat artifacts/SHA256SUMS.txt
          echo "------------------------"

      - name: Generate build-provenance attestation for the .nupkg files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*.nupkg"

      - name: Generate build-provenance attestation for the SBOM
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/bom.json"

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.*nupkg
            artifacts/bom.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: pack
    # Bind to a GitHub Environment so an approver can gate the actual push to
    # nuget.org. Configure the 'nuget-publish' environment in repo settings; with
    # Trusted Publishing there is no API-key secret to store — review is enforced
    # by the environment's required reviewers, and the OIDC token is scoped to
    # this environment when the nuget.org policy includes it.
    environment: nuget-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required: mint the GitHub OIDC token for NuGet/login
    env:
      NUGET_SIGNING_CERT: ${{ secrets.NUGET_SIGNING_CERT }}
      NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # nuget.org API key. Requires `id-token: write` (above) and a matching
      # Trusted Publishing policy on nuget.org (see the header comment). The
      # minted key is exposed to later steps as steps.nuget-login.outputs.NUGET_API_KEY.
      - name: NuGet trusted-publishing login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Optional: author code-sign the .nupkg files when a code-signing cert is
      # provided. If the secret is absent we log it and continue (with the
      # repo-signing-only stance documented in KNOWN-GAPS.md). When the secret
      # is present, the cert is materialised to a temp file, used by
      # `dotnet nuget sign`, and the file is removed in `always()` cleanup.
      - name: Author code-sign packages (if certificate available)
        run: |
          set -euo pipefail
          if [ -z "${NUGET_SIGNING_CERT}" ]; then
            echo "NUGET_SIGNING_CERT not set — packages will rely on nuget.org repository signing only."
            echo "See KNOWN-GAPS.md for the rationale and roadmap."
            exit 0
          fi

          cert_path=$(mktemp --suffix=.pfx)
          # Cert is stored as base64 in the secret.
          echo "$NUGET_SIGNING_CERT" | base64 -d > "$cert_path"
          chmod 600 "$cert_path"

          echo "Author signing artifacts/*.nupkg ..."
          dotnet nuget sign artifacts/*.nupkg \
              --certificate-path "$cert_path" \
              --certificate-password "$NUGET_SIGNING_CERT_PASSWORD" \
              --timestamper "http://timestamp.digicert.com" \
              --overwrite

          shred -u "$cert_path" || rm -f "$cert_path"
          echo "::notice::Packages author-signed."

      # NuGet.org also applies repository signing on push. Build-provenance
      # attestations (in the pack job above) are an independent transparency
      # signal — anyone can verify with `gh attestation verify <file>
      # --repo systemslibrarian/postquantum-jwt`.
      #
      # The push is split into two explicit, sequential steps so the ordering
      # is a contract, not a coincidence of alphabetical glob expansion:
      # PostQuantum.Jwt must be uploaded BEFORE PostQuantum.Jwt.AspNetCore,
      # because the AspNetCore sibling's .nuspec lists the core as a runtime
      # dependency. NuGet.org accepts the upload either way, but consumers
      # who hit the sibling before the core finishes indexing will see a
      # transient restore failure — sequencing the uploads narrows that
      # window. `dotnet nuget push` uploads each .nupkg's adjacent .snupkg
      # automatically. `--skip-duplicate` keeps re-runs idempotent.
      - name: Push core (PostQuantum.Jwt) first
        env:
          PKG_VERSION: ${{ needs.pack.outputs.package_version }}
        run: >
          dotnet nuget push "artifacts/PostQuantum.Jwt.${PKG_VERSION}.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push AspNetCore sibling (depends on core)
        env:
          PKG_VERSION: ${{ needs.pack.outputs.package_version }}
        run: >
          dotnet nuget push "artifacts/PostQuantum.Jwt.AspNetCore.${PKG_VERSION}.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The analyzers package depends only on the core library identity (consumers
      # add it alongside PostQuantum.Jwt), so it pushes after core has indexed.
      - name: Push Roslyn analyzers
        env:
          PKG_VERSION: ${{ needs.pack.outputs.package_version }}
        run: >
          dotnet nuget push "artifacts/PostQuantum.Jwt.Analyzers.${PKG_VERSION}.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The dotnet-new template package scaffolds projects that PackageReference
      # both core + AspNetCore at the same version (enforced by
      # scripts/check-version-sync.sh), so it's pushed last after both have indexed.
      - name: Push dotnet new templates
        env:
          PKG_VERSION: ${{ needs.pack.outputs.package_version }}
        run: >
          dotnet nuget push "artifacts/PostQuantum.Jwt.Templates.${PKG_VERSION}.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
