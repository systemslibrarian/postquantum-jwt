# Place this file at the REPOSITORY ROOT: .github/workflows/vscode-release.yml
# (GitHub only runs workflows from the root .github/workflows/ directory,
#  never from a subfolder. The path filter below scopes it to the extension.)

name: vscode-extension-release

on:
  push:
    tags:
      - "vscode-v*"        # e.g. vscode-v0.1.0 — distinct from your NuGet tags
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to create the GitHub Release

defaults:
  run:
    working-directory: tools/vscode

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: tools/vscode/*.vsix
          generate_release_notes: true
