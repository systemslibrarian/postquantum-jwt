name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build -c Release --no-restore

      # The native ML-KEM / ML-DSA primitives require OpenSSL 3.5+. Stock GitHub
      # runners may ship an older OpenSSL, in which case the post-quantum tests
      # SKIP THEMSELVES (with a reason) rather than fail — see the test summary.
      # This step records what the runner actually supports for transparency.
      - name: Report OpenSSL version
        run: openssl version

      - name: Test (Release)
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
